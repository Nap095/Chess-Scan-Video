<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Scan Video</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #262421; color: #eee; margin: 0; padding: 2rem; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-weight: 600; }
  #drop { border: 3px dashed #769656; border-radius: 12px; padding: 2.5rem 1rem; text-align: center;
          cursor: pointer; transition: background .15s; }
  #drop.over { background: #3a3a35; }
  #drop small { color: #aaa; }
  .opts { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0; align-items: center; }
  input[type=text] { background: #3a3a35; border: 1px solid #555; color: #eee; padding: .4rem .6rem; border-radius: 6px; }
  button { background: #769656; color: #fff; border: 0; padding: .55rem 1.1rem; border-radius: 6px; cursor: pointer; font-size: 1rem; }
  button.secondary { background: #555; }
  button:disabled { opacity: .5; cursor: default; }
  progress { width: 100%; height: 1.2rem; }
  #status { margin: .8rem 0 .3rem; min-height: 1.4rem; }
  #log { background: #1c1b19; border-radius: 6px; padding: .5rem; height: 6rem; overflow: auto;
         font: .8rem monospace; white-space: pre-wrap; color: #9a9; }
  textarea { width: 100%; box-sizing: border-box; height: 14rem; background: #1c1b19; color: #eee; border: 1px solid #555;
             border-radius: 6px; padding: .6rem; font: .95rem monospace; margin-top: .4rem; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 1.2rem; }
  .err { color: #f77; }
</style>
</head>
<body>
<main>
  <h1>♟ Chess Scan Video</h1>
  <div id="drop">
    <strong>Glissez votre vidéo ici</strong> ou cliquez pour la choisir<br>
    <small id="fname">mp4, mkv, avi, mov, webm</small>
    <input id="file" type="file" accept="video/*,.mkv" hidden>
  </div>

  <div class="opts">
    <label>Blancs <input type="text" id="white" placeholder="?"></label>
    <label>Noirs <input type="text" id="black" placeholder="?"></label>
  </div>
  <button id="go" disabled>Extraire le PGN</button>
  <button id="stop" class="secondary" hidden>Annuler</button>

  <div id="status"></div>
  <progress id="bar" value="0" max="1" hidden></progress>
  <div id="log" hidden></div>

  <div class="row"><strong>PGN</strong><button id="copy" class="secondary" disabled>Copier</button></div>
  <textarea id="pgn" placeholder="Le PGN de la partie apparaîtra ici…"></textarea>
</main>

<script>
const $ = id => document.getElementById(id);
let file = null, job = null;

const drop = $("drop"), input = $("file");
drop.onclick = () => input.click();
input.onchange = () => setFile(input.files[0]);
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => setFile(ev.dataTransfer.files[0]));
// évite que le navigateur ouvre la vidéo si on la dépose à côté de la zone
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());

function setFile(f) {
  if (!f) return;
  file = f;
  $("fname").textContent = `${f.name} (${(f.size / 1048576).toFixed(1)} Mo)`;
  $("go").disabled = false;
}

function busy(b) {
  $("go").disabled = b || !file;
  $("stop").hidden = !b;
  $("bar").hidden = !b;
  $("log").hidden = false;
}

function setStatus(msg, err) {
  $("status").textContent = msg;
  $("status").className = err ? "err" : "";
}

$("go").onclick = () => {
  const fd = new FormData();
  fd.append("video", file);
  fd.append("white", $("white").value);
  fd.append("black", $("black").value);
  $("pgn").value = ""; $("log").textContent = ""; $("copy").disabled = true;
  busy(true); setStatus("Envoi de la vidéo…"); $("bar").value = 0;

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/upload");
  xhr.upload.onprogress = e => { if (e.lengthComputable) $("bar").value = e.loaded / e.total; };
  xhr.onload = () => {
    let r = {};
    try { r = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status !== 200) { busy(false); return setStatus(r.error || "Échec de l'envoi.", true); }
    job = r.job; setStatus("Analyse en cours…"); $("bar").value = 0; poll(0);
  };
  xhr.onerror = () => { busy(false); setStatus("Erreur réseau.", true); };
  xhr.send(fd);
};

$("stop").onclick = () => { if (job) fetch("/cancel/" + job, { method: "POST" }); };

function poll(since) {
  fetch(`/status/${job}?since=${since}`).then(r => r.json()).then(s => {
    if (s.log.length) {
      const log = $("log");
      log.textContent += s.log.join("\n") + "\n";
      log.scrollTop = log.scrollHeight;
    }
    $("bar").value = s.progress;
    if (s.status === "running") {
      setStatus(`Analyse en cours… ${Math.round(s.progress * 100)} %`);
      setTimeout(() => poll(s.next), 1000);
    } else {
      busy(false); $("bar").hidden = true;
      if (s.status === "done") {
        $("pgn").value = s.pgn; $("copy").disabled = !s.pgn;
        setStatus("Terminé.");
      } else if (s.status === "cancelled") setStatus("Analyse annulée.");
      else setStatus(s.error, true);
    }
  }).catch(() => { setStatus("Connexion au serveur perdue.", true); busy(false); });
}

$("copy").onclick = async () => {
  const t = $("pgn");
  try { await navigator.clipboard.writeText(t.value); }
  catch (e) { t.select(); document.execCommand("copy"); }
  const old = $("copy").textContent;
  $("copy").textContent = "Copié ✓";
  setTimeout(() => $("copy").textContent = old, 1500);
};
</script>
</body>
</html>
